[colors]
bg     = #992E3440
bg-alt = #993B4252
fg     = #ECEFF4
fg-alt = #81A1C1

[bar/base]
width = 100%
bottom = true
background = ${colors.bg}
foreground = ${colors.fg}
monitor = ${env:MONITOR:}
font-0 = JetBrainsMono Nerd Font:size=11;2
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0
modules-left = i3 xwindow
modules-center = date
modules-right = pulseaudio network temperature-cpu temperature-nvme disk-root disk-data
wm-restack = i3

[bar/main-fhd]
inherit = bar/base
height = 32
font-0 = JetBrainsMono Nerd Font:size=11;2

[bar/main-fhd-tray]
inherit = bar/main-fhd
modules-right = pulseaudio network temperature-cpu temperature-nvme disk-root disk-data systray

[bar/main-4k]
inherit = bar/base
height = 48
font-0 = JetBrainsMono Nerd Font:size=17;4

[bar/main-4k-tray]
inherit = bar/main-4k
modules-right = pulseaudio network temperature-cpu temperature-nvme disk-root disk-data systray

[module/i3]
type = internal/i3
index-sort = true
wrapping-scroll = false
pin-workspaces = true
label-focused = %index%
label-focused-foreground = #ECEFF4
label-focused-background = #5E81AC
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = #7B8394
label-unfocused-background = #3B4252
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = #D8DEE9
label-visible-background = #4C566A
label-visible-padding = 2
label-urgent = %index%
label-urgent-foreground = #ECEFF4
label-urgent-background = #BF616A
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.fg-alt}

[module/systray]
type = internal/tray
format-background = ${colors.bg-alt}
format-padding = 1
tray-spacing = 8pt
tray-size = 60%

[module/date]
type = internal/date
interval = 5
date = %Y-%m-%d
time = %H:%M
label = %date%  %time%
label-foreground = #A3BE8C

[module/pulseaudio]
type = internal/pulseaudio
label-volume =  %percentage%%
label-volume-foreground = ${colors.fg-alt}
label-volume-background = ${colors.bg-alt}
label-volume-padding = 2
label-muted =  muted
label-muted-foreground = ${colors.fg-alt}
label-muted-background = ${colors.bg-alt}
label-muted-padding = 2

[module/network]
type = internal/network
interface = ${env:NET_IFACE:}
label-connected = net %downspeed%  %upspeed%
label-connected-foreground = ${colors.fg-alt}
label-connected-background = ${colors.bg-alt}
label-connected-padding = 2
label-disconnected = net down
label-disconnected-foreground = ${colors.fg-alt}
label-disconnected-background = ${colors.bg-alt}
label-disconnected-padding = 2

[module/temperature-cpu]
type = internal/temperature
hwmon-path = ${env:HWMON_CPU:}
warn-temperature = 80
label =  %temperature-c%
label-foreground = ${colors.fg-alt}
label-background = ${colors.bg-alt}
label-padding = 2
label-warn =  %temperature-c%
label-warn-background = ${colors.bg-alt}
label-warn-foreground = #EBCB8B
label-warn-padding = 2

[module/temperature-nvme]
type = internal/temperature
hwmon-path = ${env:HWMON_NVME:}
warn-temperature = 70
label =  %temperature-c%
label-foreground = ${colors.fg-alt}
label-background = ${colors.bg-alt}
label-padding = 2
label-warn =  %temperature-c%
label-warn-background = ${colors.bg-alt}
label-warn-foreground = #EBCB8B
label-warn-padding = 2

[module/disk-root]
type = internal/fs
mount-0 = /
label-mounted =  / %free%
label-mounted-foreground = ${colors.fg-alt}
label-mounted-background = ${colors.bg-alt}
label-mounted-padding = 2

[module/disk-data]
type = internal/fs
mount-0 = /data
label-mounted =  /data %free%
label-mounted-foreground = ${colors.fg-alt}
label-mounted-background = ${colors.bg-alt}
label-mounted-padding = 2
